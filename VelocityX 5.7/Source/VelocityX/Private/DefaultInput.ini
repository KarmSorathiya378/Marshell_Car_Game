; ==============================================================================
; VELOCITY X - Default Input Configuration
; Location: VelocityX/Source/VelocityX/Private/DefaultInput.ini
; Compatible with: AVelocityXPlayerController, BaseCar, ChaosVehicles
; ==============================================================================

[/Script/Engine.InputSettings]
bUseMouseForTouch=False
bEnableMouseSmoothing=False

; ==============================================================================
; ACTION MAPPINGS
; ==============================================================================

; --- Handbrake (Space / Gamepad Face Button Bottom) ---
+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Bottom)

; --- Camera Mode Toggle (C / Gamepad Right Thumbstick Click) ---
+ActionMappings=(ActionName="Camera",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=C)
+ActionMappings=(ActionName="Camera",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_RightThumbstick)

; --- Headlights Toggle (L / Gamepad D-Pad Up) ---
+ActionMappings=(ActionName="Headlights",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=L)
+ActionMappings=(ActionName="Headlights",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_DPad_Up)

; --- Reset Vehicle Upright (R / Gamepad Special Left) ---
+ActionMappings=(ActionName="Reset",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=R)
+ActionMappings=(ActionName="Reset",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_Special_Left)

; --- Pause Menu Toggle (Escape / P / Gamepad Special Right) ---
+ActionMappings=(ActionName="Pause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Escape)
+ActionMappings=(ActionName="Pause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=P)
+ActionMappings=(ActionName="Pause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_Special_Right)

; ==============================================================================
; AXIS MAPPINGS (VEHICLE DRIVING & COCKPIT MOUSE LOOK)
; ==============================================================================

; --- Throttle (W / Up Arrow / Gamepad Right Trigger) ---
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Gamepad_RightTriggerAxis)

; --- Brake / Reverse (S / Down Arrow / Gamepad Left Trigger) ---
+AxisMappings=(AxisName="Brake",Scale=1.000000,Key=S)
+AxisMappings=(AxisName="Brake",Scale=1.000000,Key=Down)
+AxisMappings=(AxisName="Brake",Scale=1.000000,Key=Gamepad_LeftTriggerAxis)

; --- Steering (A [-1], D [+1], Left Arrow [-1], Right Arrow [+1], Gamepad Left Stick X) ---
+AxisMappings=(AxisName="Steering",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Steering",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Steering",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="Steering",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="Steering",Scale=1.000000,Key=Gamepad_LeftX)

; --- Cockpit View Free Mouse Look (Turn / LookUp) ---
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)

; --- Fallback Generic Character Movement ---
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
