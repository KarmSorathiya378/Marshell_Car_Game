[/Script/Engine.InputSettings]
; Copyright VELOCITY X Racing. All Rights Reserved.
; Input Configuration for VELOCITY X

; Use Enhanced Input System as default
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/VELOCITYX.VELOCITYXInputComponent
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseOverEvents=True
bEnableClickEvents=True
bAlwaysShowTouchInterface=False
bShowConsoleOnRKey=False

; ==============================================================================
; ACTION MAPPINGS
; ==============================================================================

; --- Throttle (Keyboard & Fallback) ---
+ActionMappings=(ActionName="Throttle",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=W)
+ActionMappings=(ActionName="Throttle",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Up)

; --- Brake / Reverse (Keyboard & Fallback) ---
+ActionMappings=(ActionName="Brake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=S)
+ActionMappings=(ActionName="Brake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Down)

; --- Steer Left (Digital) ---
+ActionMappings=(ActionName="SteerLeft",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=A)
+ActionMappings=(ActionName="SteerLeft",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Left)

; --- Steer Right (Digital) ---
+ActionMappings=(ActionName="SteerRight",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=D)
+ActionMappings=(ActionName="SteerRight",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Right)

; --- Handbrake (Space / Gamepad A & B) ---
+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Right)

; --- Manual Transmission Shifting ---
+ActionMappings=(ActionName="ShiftUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=E)
+ActionMappings=(ActionName="ShiftUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="ShiftDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Q)
+ActionMappings=(ActionName="ShiftDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_LeftShoulder)

; --- Cycle Camera (C / D-Pad Down & Up) ---
+ActionMappings=(ActionName="Camera",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=C)
+ActionMappings=(ActionName="Camera",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_DPad_Down)
+ActionMappings=(ActionName="Camera",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_DPad_Up)

; --- Quick Camera Presets (Gamepad D-Pad) ---
+ActionMappings=(ActionName="CameraChase",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_DPad_Right)
+ActionMappings=(ActionName="CameraCockpit",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_DPad_Left)

; --- Toggle Headlights (L / Gamepad X) ---
+ActionMappings=(ActionName="Headlights",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=L)
+ActionMappings=(ActionName="Headlights",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Left)

; --- Reset Car (R / Gamepad Y) ---
+ActionMappings=(ActionName="Reset",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=R)
+ActionMappings=(ActionName="Reset",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Top)

; --- Pause Game (Esc / Gamepad Start / Special Right) ---
+ActionMappings=(ActionName="Pause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Escape)
+ActionMappings=(ActionName="Pause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_Special_Right)

; ==============================================================================
; AXIS MAPPINGS (Analog Controls)
; ==============================================================================

; --- Steering Axis (-1.0 to 1.0) ---
+AxisMappings=(AxisName="Steering",Key=Gamepad_LeftX,Scale=1.000000)
+AxisMappings=(AxisName="Steering",Key=D,Scale=1.000000)
+AxisMappings=(AxisName="Steering",Key=Right,Scale=1.000000)
+AxisMappings=(AxisName="Steering",Key=A,Scale=-1.000000)
+AxisMappings=(AxisName="Steering",Key=Left,Scale=-1.000000)

; --- Throttle Axis (0.0 to 1.0) ---
+AxisMappings=(AxisName="ThrottleAxis",Key=Gamepad_RightTriggerAxis,Scale=1.000000)
+AxisMappings=(AxisName="ThrottleAxis",Key=W,Scale=1.000000)
+AxisMappings=(AxisName="ThrottleAxis",Key=Up,Scale=1.000000)

; --- Brake Axis (0.0 to 1.0) ---
+AxisMappings=(AxisName="BrakeAxis",Key=Gamepad_LeftTriggerAxis,Scale=1.000000)
+AxisMappings=(AxisName="BrakeAxis",Key=S,Scale=1.000000)
+AxisMappings=(AxisName="BrakeAxis",Key=Down,Scale=1.000000)

; --- Mouse Steering Assist Axis ---
+AxisMappings=(AxisName="MouseSteerAxis",Key=MouseX,Scale=1.000000)

; --- Free Look Around Camera (Optional orbit/pan) ---
+AxisMappings=(AxisName="LookRight",Key=MouseX,Scale=1.000000)
+AxisMappings=(AxisName="LookRight",Key=Gamepad_RightX,Scale=1.000000)
+AxisMappings=(AxisName="LookUp",Key=MouseY,Scale=-1.000000)
+AxisMappings=(AxisName="LookUp",Key=Gamepad_RightY,Scale=-1.000000)
