; Enhanced Input Mapping Context and Actions Configuration for VELOCITY X

[InputMappingContext.IMC_Driving]
ContextName="IMC_Driving"
Priority=0
Description="Active driving context for vehicle control, transmission, camera switching, and game management"

; --- Throttle ---
; ValueType: Axis1D (Float)
Action.IA_Throttle.Key=W
Action.IA_Throttle.Key=Up
Action.IA_Throttle.Key=Gamepad_RightTriggerAxis
Action.IA_Throttle.Trigger=Down
Action.IA_Throttle.Modifier=DeadZone(LowerThreshold=0.02, UpperThreshold=1.0)

; --- Brake / Reverse ---
; ValueType: Axis1D (Float)
Action.IA_Brake.Key=S
Action.IA_Brake.Key=Down
Action.IA_Brake.Key=Gamepad_LeftTriggerAxis
Action.IA_Brake.Trigger=Down
Action.IA_Brake.Modifier=DeadZone(LowerThreshold=0.02, UpperThreshold=1.0)

; --- Steering ---
; ValueType: Axis1D (Float)
Action.IA_Steer.Key=D
Action.IA_Steer.Key=Right
Action.IA_Steer.Key=A
Action.IA_Steer.Modifier.A=Negate
Action.IA_Steer.Key=Left
Action.IA_Steer.Modifier.Left=Negate
Action.IA_Steer.Key=Gamepad_LeftX
Action.IA_Steer.Modifier.Gamepad_LeftX=DeadZone(LowerThreshold=0.05, UpperThreshold=1.0)
Action.IA_Steer.Trigger=Down

; --- Handbrake ---
; ValueType: Boolean (Digital)
Action.IA_Handbrake.Key=SpaceBar
Action.IA_Handbrake.Key=Gamepad_FaceButton_Bottom
Action.IA_Handbrake.Key=Gamepad_FaceButton_Right
Action.IA_Handbrake.Trigger=Pressed

; --- Manual Shifting ---
Action.IA_ShiftUp.Key=E
Action.IA_ShiftUp.Key=Gamepad_RightShoulder
Action.IA_ShiftUp.Trigger=Pressed

Action.IA_ShiftDown.Key=Q
Action.IA_ShiftDown.Key=Gamepad_LeftShoulder
Action.IA_ShiftDown.Trigger=Pressed

; --- Camera Cycling (ChaseClose -> Hood -> Cockpit -> ChaseFar) ---
; ValueType: Boolean (Digital)
Action.IA_CycleCamera.Key=C
Action.IA_CycleCamera.Key=Gamepad_DPad_Down
Action.IA_CycleCamera.Key=Gamepad_DPad_Up
Action.IA_CycleCamera.Trigger=Pressed

; --- Headlights Toggle ---
; ValueType: Boolean (Digital)
Action.IA_ToggleHeadlights.Key=L
Action.IA_ToggleHeadlights.Key=Gamepad_FaceButton_Left
Action.IA_ToggleHeadlights.Trigger=Pressed

; --- Car Reset (If crashed / flipped) ---
; ValueType: Boolean (Digital)
Action.IA_ResetCar.Key=R
Action.IA_ResetCar.Key=Gamepad_FaceButton_Top
Action.IA_ResetCar.Trigger=Pressed

; --- Pause Menu ---
; ValueType: Boolean (Digital, bExecuteWhenPaused=true)
Action.IA_Pause.Key=Escape
Action.IA_Pause.Key=Gamepad_Special_Right
Action.IA_Pause.Trigger=Pressed
Action.IA_Pause.bExecuteWhenPaused=True

; --- Mouse Steering Assist ---
; ValueType: Axis1D (Float)
Action.IA_MouseSteer.Key=MouseX
Action.IA_MouseSteer.Trigger=Down
Action.IA_MouseSteer.Modifier=Scalar(0.015)

; --- Camera Free Look ---
; ValueType: Axis2D (Vector2D)
Action.IA_LookAround.Key=Mouse2D
Action.IA_LookAround.Key=Gamepad_Right2D
Action.IA_LookAround.Trigger=Down

[InputMappingContext.IMC_Menu]
ContextName="IMC_Menu"
Priority=10
Description="Context active in main menus and garage selection"
Action.IA_Navigate.Key=Gamepad_LeftY
Action.IA_Navigate.Key=Gamepad_DPad_Up
Action.IA_Select.Key=Gamepad_FaceButton_Bottom
Action.IA_Select.Key=Enter
Action.IA_Back.Key=Gamepad_FaceButton_Right
Action.IA_Back.Key=Escape

[InputMappingContext.IMC_Pause]
ContextName="IMC_Pause"
Priority=20
Description="Context active while game is paused"
Action.IA_Resume.Key=Escape
Action.IA_Resume.Key=Gamepad_Special_Right
Action.IA_Resume.bExecuteWhenPaused=True
Action.IA_MenuNavigate.Key=Gamepad_LeftY
Action.IA_MenuSelect.Key=Gamepad_FaceButton_Bottom
